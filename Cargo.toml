# To run this checkout's CLI (e.g. check its version) use the absolute path to scripts/winter-cli, not a prebuilt
# target/ binary or an installed winter. It selects this checkout's toolchain and manifest; see context/tooling/development.md.
[workspace]
members = ["crates/cli", "crates/dev-sample", "crates/platform", "crates/test-harness"]
default-members = ["crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
winter-platform = { path = "crates/platform", default-features = false }
