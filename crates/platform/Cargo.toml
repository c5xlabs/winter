[package]
name = "winter-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6.7", default-features = false, features = [
  "std",
  "help",
  "usage",
  "error-context",
  "suggestions",
] }
libc = { version = "0.2.191", optional = true }
thiserror = "2.0.21"

[features]
default = []
dev-sample = ["dep:libc"]
