# To run this checkout's CLI (e.g. check its version) use the absolute path to scripts/winter-cli, not a prebuilt
# target/ binary or an installed winter. It selects this checkout's toolchain and manifest; see README.md (Development).
[package]
name = "winter-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "winter"
path = "src/main.rs"

[dependencies]
winter-platform.workspace = true

[features]
default = []
dev-sample = ["winter-platform/dev-sample"]
